name: Release

# v で始まるタグを push すると、ZIP などを GitHub Release に添付する。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # CI と同じ版に固定する(ci.yml の注)。
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # タグと Skill の VERSION が食い違う Release を作らない。
      - name: Check the tag matches VERSION
        run: test "v$(tr -d '[:space:]' < skills/japanese-readability-editor/VERSION)" = "$GITHUB_REF_NAME"

      - name: Validate the skill
        run: python tools/validate_skill.py

      - name: Run the tests
        run: python -m unittest discover -s tests

      - name: Build the packages
        run: python tools/package.py

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PR で確認済みのリリースノートがあれば、それを使う。なければ自動生成する。
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/japanese-readability-editor.zip \
            dist/japanese-readability-editor.sha256 \
            dist/gemini-apps-instructions.md \
            --title "$GITHUB_REF_NAME" \
            "${notes_args[@]}"
