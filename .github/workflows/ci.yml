name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.x" }
          - { os: macos-latest, python: "3.x" }
          - { os: windows-latest, python: "3.x" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Validate the skill
        run: python tools/validate_skill.py

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Build the packages
        run: python tools/package.py
