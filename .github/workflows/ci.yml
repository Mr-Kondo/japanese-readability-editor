name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }}${{ matrix.sudachi && format(', sudachi {0}', matrix.sudachi) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest は、2026-10-19 から 11-19 にかけて 26.04 へ移る。移行中に版が混ざらないよう、版を固定する。
        include:
          - { os: ubuntu-26.04, python: "3.10" }
          - { os: ubuntu-26.04, python: "3.x" }
          - { os: ubuntu-26.04, python: "3.x", sudachi: core }
          - { os: ubuntu-26.04, python: "3.x", sudachi: small }
          - { os: macos-latest, python: "3.x" }
          - { os: windows-latest, python: "3.x" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # compare_rewrite.py は、SudachiPy が入っていれば使う。入っていない経路は、ほかのジョブで試す。
      # small は、Skill がクラウドの実行環境で入れる辞書。
      - name: Install SudachiPy
        if: matrix.sudachi
        run: python -m pip install sudachipy sudachidict-${{ matrix.sudachi }}

      - name: Validate the skill
        run: python tools/validate_skill.py

      # 国語表記の規則データ(出典、必須項目、例の再検査)。ネットワークは使わない。公式資料の更新確認(tools/update_kokugo_sources.py verify)は含めない。
      - name: Validate the kokugo rules
        run: python skill/japanese-readability-editor/scripts/validate_kokugo_rules.py

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Build the packages
        run: python tools/package.py
