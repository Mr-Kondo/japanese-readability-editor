name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }}${{ matrix.sudachi && ', sudachi' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.x" }
          - { os: ubuntu-latest, python: "3.x", sudachi: true }
          - { os: macos-latest, python: "3.x" }
          - { os: windows-latest, python: "3.x" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # compare_rewrite.py は、SudachiPy が入っていれば使う。入っていない経路は、ほかのジョブで試す。
      - name: Install SudachiPy
        if: matrix.sudachi
        run: python -m pip install sudachipy sudachidict-core

      - name: Validate the skill
        run: python tools/validate_skill.py

      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Build the packages
        run: python tools/package.py
